[project]
name = "agentic-ai-workbench"
version = "1.0.0"
description = "Production-grade agentic AI framework based on AI Agents in Action"
requires-python = ">=3.11"
authors = [
    {name = "Edwin Salguero", email = "edwin@parallel-llc.com"}
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
